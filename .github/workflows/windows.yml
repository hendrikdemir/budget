# Builds the Windows version and runs the tests on Windows. Download it from the run's Artifacts.
name: Windows build
on:
  push:
    branches: [windows-support]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest
      - name: Build
        shell: pwsh
        run: packaging\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Budget-windows
          path: dist/Budget-windows.zip
