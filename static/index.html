<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Budget</h1>
    <nav class="tabs" data-i18n-aria-label="app.pages">
      <a href="#" data-view="overview" data-i18n="app.overview"></a>
      <a href="#history" data-view="history" data-i18n="app.history"></a>
      <a href="#outlook" data-view="outlook" class="full-only" data-i18n="app.outlook"></a>
    </nav>
    <div class="actions">
      <button id="settings-btn" class="icon-btn" data-i18n-aria-label="common.settings" data-i18n-title="common.settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="update-banner-wrap">
    <div id="update-banner" class="card update-banner" role="status" hidden>
      <span><strong id="update-banner-text"></strong> <span class="muted" data-i18n="updates.yourDataStaysAsIt"></span></span>
      <span class="spacer"></span>
      <button type="button" id="update-how" class="primary-btn" data-i18n="updates.howToUpdate"></button>
      <button type="button" id="update-later" class="icon-btn" data-i18n-aria-label="updates.hideUntilBudgetRestarts" data-i18n-title="updates.hideUntilBudgetRestarts">×</button>
    </div>
  </div>

  <main id="overview-view">
    <nav class="toolbar">
      <div class="month-switch">
        <button id="prev-month" class="pop-nav" data-i18n-aria-label="common.previousMonth">‹</button>
        <button id="month-btn" class="month-btn"></button>
        <button id="next-month" class="pop-nav" data-i18n-aria-label="common.nextMonth">›</button>
      </div>
      <button id="today-btn" class="ghost-btn" hidden data-i18n="overview.thisMonth"></button>
      <span class="spacer"></span>
      <button id="income-btn" class="ghost-btn" data-i18n="overview.addIncome"></button>
      <button id="add-btn" class="primary-btn" data-i18n="overview.addExpense"></button>
    </nav>

    <section class="card guide" id="guide" hidden>
      <div class="section-head">
        <h3 data-i18n="overview.gettingStarted"></h3>
        <span id="guide-progress" class="muted"></span>
        <span class="spacer"></span>
        <button type="button" id="guide-hide" class="link-btn" data-i18n="overview.hide"></button>
      </div>
      <p class="muted guide-intro" data-i18n="overview.guideIntro"></p>
      <ol id="guide-steps" class="guide-steps"></ol>
    </section>

    <section class="card total-card">
      <span class="label" id="total-label"></span>
      <span id="total" class="total"></span>
      <div class="total-bar" id="total-bar" aria-hidden="true">
        <span class="seg in"></span><span class="seg out"></span><i class="budget-mark"></i>
      </div>
      <span id="total-sub"></span>
      <span id="total-over" class="total-over" hidden></span>
      <span id="total-income" class="total-income" hidden></span>
      <div id="total-review" class="total-review" hidden></div>
    </section>

    <section class="card offer" id="offer" hidden></section>

    <section class="card result-card">
      <div class="section-head"><h3 id="result-title"></h3></div>
      <div id="result-rows" class="result-rows"></div>
    </section>

    <section class="card accounts">
      <button class="account-row" data-account="bank">
        <span class="label" data-i18n="common.bankAccount"></span>
        <span class="balance-amount"></span>
        <span class="balance-status muted"></span>
        <span class="balance-action" data-i18n="common.check"></span>
      </button>
      <button class="account-row" data-account="savings">
        <span class="label" data-i18n="common.savings"></span>
        <span class="balance-amount"></span>
        <span class="balance-status muted"></span>
        <span class="balance-action" data-i18n="common.check"></span>
      </button>
    </section>

    <section class="card">
      <div class="section-head">
        <h3 data-i18n="common.budgets"></h3>
        <button type="button" class="help-tip" data-help="budgets">?</button>
        <span id="carried-total" class="carried-total" hidden></span>
        <span class="spacer"></span>
        <button id="expand-all" class="link-btn" hidden data-i18n="overview.expandAll"></button>
        <button id="manage-btn" class="link-btn" data-i18n="overview.edit"></button>
      </div>
      <div id="budgets" class="budget-list"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h3 data-i18n="overview.transactions"></h3>
        <span id="filter" class="filter-chip" hidden></span>
        <span class="spacer"></span>
        <span id="count" class="muted"></span>
        <button id="bank-import-btn" class="link-btn" data-i18n-title="overview.addTransactionsFromAFile" data-i18n="common.import"></button>
        <button id="csv-btn" class="link-btn" data-i18n-title="overview.downloadTransactionsAsACsv" data-i18n="overview.export"></button>
        <button id="select-btn" class="link-btn" data-i18n="overview.select"></button>
        <input type="file" id="bank-file" accept=".csv,text/csv" hidden>
      </div>
      <div class="tx-filters">
        <label class="search">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search" type="search" data-i18n-placeholder="overview.searchTransactions" data-i18n-aria-label="overview.searchTransactions" autocomplete="off">
        </label>
        <div class="segmented small" id="type-filter" data-i18n-aria-label="overview.type">
          <button type="button" data-type="all" class="active" data-i18n="overview.all"></button>
          <button type="button" data-type="expense" data-i18n="overview.expenses"></button>
          <button type="button" data-type="income" data-i18n="common.income"></button>
          <button type="button" data-type="transfer" data-i18n="common.savings"></button>
        </div>
        <label class="all-months" data-i18n-title="overview.searchInEveryMonthNot">
          <input type="checkbox" id="all-months"> <span data-i18n="overview.searchAllMonths"></span>
        </label>
      </div>
      <div id="selection-bar" class="selection-bar" hidden>
        <span id="selection-count"></span>
        <span class="spacer"></span>
        <button id="select-all" class="link-btn" data-i18n="overview.selectAll"></button>
        <button id="select-cancel" class="ghost-btn" data-i18n="common.cancel"></button>
        <a id="select-export" class="ghost-btn" download data-i18n="overview.export"></a>
        <button id="select-delete" class="danger-btn" disabled data-i18n="common.delete"></button>
      </div>
      <ul id="expenses" class="day-list"></ul>
      <p id="empty" class="muted empty" hidden data-i18n="overview.noSpendingRecordedThisMonth"></p>
    </section>
  </main>

  <main id="history-view" hidden>
    <nav class="toolbar">
      <div class="month-switch">
        <button id="history-prev" class="pop-nav" data-i18n-aria-label="common.previousYear">‹</button>
        <b id="history-year" class="month-btn year-label"></b>
        <button id="history-next" class="pop-nav" data-i18n-aria-label="common.nextYear">›</button>
      </div>
    </nav>
    <p id="history-note" class="muted history-note"></p>
    <section class="card" id="history-empty" hidden><p class="muted"></p></section>
    <section class="card history-summary" id="history-summary"></section>
    <section class="card" id="history-chart-card">
      <div class="section-head">
        <h3 data-i18n="history.balances"></h3>
        <span class="spacer"></span>
        <span class="legend">
          <span><i class="swatch-line"></i><span data-i18n="history.savings"></span></span>
          <span><i class="swatch-line bank"></i><span data-i18n="common.bankAccount"></span></span>
          <span><i class="swatch-bar"></i><span data-i18n="common.resultPerMonth"></span></span>
        </span>
      </div>
      <div id="history-chart" class="hist-plot"></div>
      <p id="history-chart-empty" class="muted" hidden data-i18n="history.chartNeedsStartingBalance"></p>
    </section>
    <section class="card" id="history-budgets-card">
      <div class="section-head"><h3 data-i18n="common.budgets"></h3></div>
      <div class="table-wrap"><table id="history-budgets" class="outlook-table budget-history"></table></div>
    </section>
    <section class="card" id="history-table-card">
      <div class="section-head"><h3 data-i18n="common.monthByMonth"></h3></div>
      <div class="table-wrap"><table id="history-table" class="outlook-table"></table></div>
    </section>
  </main>

  <main id="outlook-view" hidden>
    <section class="card outlook-summary" id="outlook-summary"></section>

    <section class="card" id="outlook-chart-card">
      <div class="section-head">
        <h3 data-i18n="outlook.savingsOutlook"></h3>
        <button type="button" class="help-tip" data-help="outlook">?</button>
        <span class="spacer"></span>
        <span class="legend">
          <span><i class="swatch-line good"></i><span data-i18n="outlook.legendAbove"></span> <i class="swatch-line bad"></i><span data-i18n="outlook.legendBelowBuffer"></span></span>
          <span><i class="swatch-line dashed"></i><span id="buffer-label"></span></span>
          <span><i class="swatch-bar"></i><span data-i18n="common.resultPerMonth"></span></span>
        </span>
        <button id="buffer-edit" class="link-btn" data-i18n="outlook.changeSafetyBuffer"></button>
      </div>
      <div id="outlook-chart" class="hist-plot"></div>
    </section>

    <section class="card">
      <div class="section-head"><h3 data-i18n="common.monthByMonth"></h3></div>
      <div class="table-wrap"><table id="outlook-table" class="outlook-table"></table></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h3 data-i18n="outlook.expectedIncome"></h3>
        <span class="spacer"></span>
        <button class="link-btn" data-add-plan="income" data-i18n="outlook.addIncome"></button>
      </div>
      <ul id="plans-income" class="plan-list"></ul>
    </section>

    <section class="card">
      <div class="section-head">
        <h3 data-i18n="outlook.plannedExpenses"></h3>
        <span class="spacer"></span>
        <button class="link-btn" data-add-plan="expense" data-i18n="outlook.addExpense"></button>
      </div>
      <p class="muted hint plan-hint" data-i18n="outlook.extraCostsOnTopOf"></p>
      <ul id="plans-expense" class="plan-list"></ul>
    </section>
  </main>

  <dialog id="buffer-dialog">
    <form id="buffer-form" novalidate>
      <div class="dialog-head">
        <h2 data-i18n="outlook.safetyBufferTitle"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
      </div>
      <p class="muted hint" data-i18n="outlook.howMuchShouldAlwaysStay"></p>
      <div class="segmented kind-switch" id="buffer-mode">
        <button type="button" data-mode="months" data-i18n="outlook.bufferModeMonths"></button>
        <button type="button" data-mode="amount" data-i18n="outlook.fixedAmount"></button>
      </div>
      <div class="fields">
        <label class="field wide" id="buffer-months-field">
          <span class="label"><span data-i18n="outlook.numberOfMonths"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <input name="months" inputmode="decimal" placeholder="1">
          <span class="error" data-error="months"></span>
        </label>
        <label class="field wide" id="buffer-amount-field">
          <span class="label"><span data-i18n="common.amount"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <span class="money-input"><span class="currency"></span><input name="amount" inputmode="decimal" placeholder="0.00"></span>
          <span class="error" data-error="amount"></span>
        </label>
      </div>
      <div class="dialog-foot">
        <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
        <button class="primary-btn" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="plan-dialog">
    <form id="plan-form" novalidate>
      <div class="dialog-head">
        <h2 id="plan-title" data-i18n="outlook.expectedIncome"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
      </div>
      <div class="fields">
        <label class="field wide">
          <span class="label"><span data-i18n="common.name"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <input name="name" data-i18n-placeholder="outlook.eGSalary">
          <span class="error" data-error="name"></span>
        </label>
        <label class="field">
          <span class="label"><span data-i18n="common.amount"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <span class="money-input"><span class="currency"></span><input name="amount" inputmode="decimal" placeholder="0.00"></span>
          <span class="error" data-error="amount"></span>
        </label>
        <div class="field wide">
          <span class="label" data-i18n="outlook.repeats"></span>
          <div class="segmented" id="repeat-options">
            <button type="button" data-repeat="once" data-i18n="outlook.once"></button>
            <button type="button" data-repeat="monthly" data-i18n="outlook.monthly"></button>
            <button type="button" data-repeat="every" data-i18n="outlook.custom"></button>
          </div>
        </div>
        <label class="field" id="plan-every-field" hidden>
          <span class="label"><span data-i18n="outlook.howOften"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <span class="every-input"><span data-i18n="outlook.every"></span> <input name="every" inputmode="numeric" value="2" data-i18n-aria-label="outlook.numberOfMonths"> <span data-i18n="outlook.months"></span></span>
          <span class="error" data-error="every"></span>
        </label>
        <div class="field">
          <span class="label" id="plan-start-label"><span data-i18n="outlook.fromLabel"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <button type="button" id="plan-start" class="input-like"></button>
        </div>
        <div class="field" id="plan-end-field">
          <span class="label"><span data-i18n="outlook.until"></span> <span class="optional" data-i18n="common.optional"></span></span>
          <button type="button" id="plan-end" class="input-like"></button>
          <button type="button" id="plan-no-end" class="link-btn" data-i18n="outlook.noEnd"></button>
          <span class="error" data-error="end"></span>
        </div>
        <p class="field wide muted plan-when" id="plan-when" hidden></p>
        <div class="field wide" id="plan-changes-field" hidden>
          <span class="label"><span data-i18n="outlook.amountChanges"></span> <span class="optional" data-i18n="common.optional"></span></span>
          <div id="plan-changes" class="history plan-changes"></div>
          <div class="change-row">
            <button type="button" id="change-month" class="input-like"></button>
            <span class="money-input"><span class="currency"></span><input id="change-amount" inputmode="decimal" data-i18n-placeholder="outlook.newAmount"></span>
            <button type="button" id="change-add" class="ghost-btn" data-i18n="common.add"></button>
          </div>
          <span class="error" data-error="change"></span>
        </div>
      </div>
      <div class="dialog-foot">
        <button type="button" id="plan-delete" class="ghost-btn danger-text" hidden data-i18n="common.delete"></button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
        <button class="primary-btn" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="expense-dialog">
    <form id="add-form" novalidate>
      <div class="dialog-head">
        <h2 id="expense-title" data-i18n="transaction.newExpense"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
      </div>
      <div class="segmented kind-switch" id="kind-options">
        <button type="button" data-kind="expense" data-i18n="common.expense"></button>
        <button type="button" data-kind="income" data-i18n="common.income"></button>
        <button type="button" data-kind="transfer" data-i18n="common.savings"></button>
      </div>
      <div class="fields">
        <label class="field">
          <span class="label"><span data-i18n="common.amount"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <span class="money-input"><span class="currency"></span><input name="amount" inputmode="decimal" placeholder="0.00"></span>
          <span class="error" data-error="amount"></span>
        </label>
        <div class="field">
          <span class="label"><span data-i18n="transaction.date"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <button type="button" id="date-btn" class="input-like"></button>
          <input type="hidden" name="date">
        </div>
        <div class="field wide paid-field full-only">
          <button type="button" id="paid-toggle" class="link-btn" data-i18n="transaction.leftYourBankOnA"></button>
          <div id="paid-row" class="paid-row" hidden>
            <span class="label" data-i18n="transaction.leftYourBankOn"></span>
            <button type="button" id="paid-btn" class="input-like"></button>
            <input type="hidden" name="paid_date">
            <button type="button" id="paid-clear" class="link-btn" data-i18n="transaction.sameDay"></button>
          </div>
        </div>
        <div class="field wide" id="transfer-field" hidden>
          <span class="label" data-i18n="transaction.direction"></span>
          <div class="segmented" id="direction-options">
            <button type="button" data-direction="save" data-i18n="common.toSavings"></button>
            <button type="button" data-direction="withdraw" data-i18n="common.fromSavings"></button>
          </div>
          <div id="leftover-hint" class="leftover-hint"></div>
        </div>
        <label class="field wide" id="payee-field">
          <span class="label"><span id="payee-label" data-i18n="common.paidTo"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <input name="payee" data-i18n-placeholder="transaction.eGSupermarket">
          <span class="error" data-error="payee"></span>
        </label>
        <div class="field wide" id="budget-field">
          <span class="label"><span id="budget-label">Budget</span> <span class="optional" data-i18n="common.optional"></span></span>
          <div id="splits" class="single"></div>
          <div id="impact" class="impact"></div>
          <span class="error" data-error="splits"></span>
          <button type="button" id="add-split" class="link-btn" data-i18n="transaction.splitAcrossBudgets"></button>
        </div>
        <label class="field wide">
          <span class="label"><span data-i18n="common.note"></span> <span class="optional" data-i18n="common.optional"></span></span>
          <input name="description" data-i18n-placeholder="transaction.eGWeeklyShop">
        </label>
      </div>
      <div class="dialog-foot">
        <button type="button" id="expense-delete" class="ghost-btn danger-text" hidden data-i18n="common.delete"></button>
        <span class="spacer"></span>
        <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
        <button class="primary-btn" id="expense-submit" data-i18n="transaction.addExpense"></button>
      </div>
    </form>
  </dialog>

  <dialog id="manager" class="wide">
    <div class="dialog-head">
      <h2 data-i18n="budgets.editBudgets"></h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
    </div>
    <p class="muted hint" data-i18n-html="budgets.intro"></p>
    <div id="budget-fit" class="budget-fit"></div>
    <div id="starter" class="starter" hidden></div>
    <div id="manager-body"></div>
    <form id="add-category" class="mgr-row">
      <input name="name" data-i18n-placeholder="budgets.newCategoryEGDiscretionary" required>
      <input name="budget" inputmode="decimal" data-i18n-placeholder="common.budget">
      <label class="carry-default full-only" data-i18n-title="budgets.carryByDefault"><input type="checkbox" name="rollover" data-i18n-aria-label="budgets.carryLeftovers"></label>
      <button class="icon-btn" data-i18n-aria-label="budgets.addCategory"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <div class="dialog-head">
        <h2 data-i18n="common.settings"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
      </div>
      <span class="label" data-i18n="settings.language"></span>
      <select id="language-select" data-i18n-aria-label="settings.language"></select>
      <span class="label" data-i18n="settings.mode"></span>
      <div class="segmented" id="mode-options">
        <button type="button" data-mode="simple" data-i18n="settings.modeSimple"></button>
        <button type="button" data-mode="full" data-i18n="settings.modeExtended"></button>
      </div>
      <p class="muted data-hint" id="mode-hint"></p>
      <span class="label" data-i18n="settings.theme"></span>
      <div class="segmented" id="theme-options">
        <button type="button" data-theme="system" data-i18n="settings.system"></button>
        <button type="button" data-theme="light" data-i18n="settings.light"></button>
        <button type="button" data-theme="dark" data-i18n="settings.dark"></button>
      </div>
      <span class="label" data-i18n="settings.currency"></span>
      <input id="currency-input" data-i18n-placeholder="settings.searchByNameOrCode" data-i18n-aria-label="settings.currency">
      <span class="label" data-i18n="settings.numbers"></span>
      <div class="segmented" id="number-options" data-i18n-aria-label="settings.howNumbersAreWritten">
        <button type="button" data-format="comma">1.234,56</button>
        <button type="button" data-format="point">1,234.56</button>
      </div>
      <span class="label" data-i18n="settings.backup"></span>
      <p class="muted data-hint" data-i18n="settings.allYourDataInOne"></p>
      <div class="data-actions">
        <a id="export-btn" class="ghost-btn" href="/api/export" download data-i18n="common.createBackup"></a>
        <button type="button" id="import-btn" class="ghost-btn" data-i18n="common.restoreFromBackup"></button>
      </div>
      <button type="button" id="clear-btn" class="link-btn danger-text clear-link" data-i18n="settings.deleteAllData"></button>
      <span class="label" data-i18n="settings.updates"></span>
      <label class="update-check"><input type="checkbox" id="update-check"> <span data-i18n="settings.checkForNewVersions"></span></label>
      <p class="muted data-hint" id="update-hint"></p>
      <input type="file" id="import-file" accept=".budget" hidden>
      <div class="dialog-foot">
        <span id="app-version" class="app-version muted"></span>
        <span class="spacer"></span>
        <button class="primary-btn" data-i18n="settings.done"></button>
      </div>
    </form>
  </dialog>

  <dialog id="balance-dialog">
    <div class="dialog-head">
      <h2><span id="balance-title" data-i18n="common.bankAccount"></span> <button type="button" class="help-tip" data-help="balance">?</button></h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
    </div>
    <div id="balance-summary" class="balance-summary"></div>
    <form id="check-form" novalidate>
      <p class="muted hint" data-i18n="accounts.enterWhatYourBankShows"></p>
      <div class="fields">
        <label class="field">
          <span class="label"><span data-i18n="accounts.balanceInYourBank"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <span class="money-input"><span class="currency"></span><input name="amount" inputmode="decimal" placeholder="0.00"></span>
          <span class="error" data-error="check"></span>
        </label>
        <div class="field">
          <span class="label"><span data-i18n="accounts.atTheEndOf"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
          <button type="button" id="check-date-btn" class="input-like"></button>
          <input type="hidden" name="date">
        </div>
      </div>
      <div class="dialog-foot"><button class="primary-btn" data-i18n="accounts.checkBalance"></button></div>
    </form>
    <ul id="check-list" class="check-list"></ul>
    <details id="start-section" class="start-section">
      <summary><span data-i18n="accounts.startingBalance"></span> <button type="button" class="help-tip" data-help="starting-point">?</button></summary>
      <form id="start-form" novalidate>
        <p class="muted hint" data-i18n="accounts.yourBalanceAtTheStart"></p>
        <div class="fields">
          <label class="field">
            <span class="label"><span data-i18n="accounts.startingBalance"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
            <span class="money-input"><span class="currency"></span><input name="amount" inputmode="decimal" placeholder="0.00"></span>
            <span class="error" data-error="start"></span>
          </label>
          <div class="field">
            <span class="label"><span data-i18n="accounts.atTheStartOf"></span> <span class="req" data-i18n-aria-label="common.required">*</span></span>
            <button type="button" id="start-date-btn" class="input-like"></button>
            <input type="hidden" name="date">
          </div>
        </div>
        <div class="dialog-foot"><button class="ghost-btn" data-i18n="accounts.saveStartingBalance"></button></div>
      </form>
    </details>
  </dialog>

  <dialog id="update-dialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2 id="update-title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
      </div>
      <p class="muted hint" id="update-current"></p>
      <div id="update-notes-block">
        <span class="label" data-i18n="updates.whatsNew"></span>
        <div id="update-notes" class="update-notes"></div>
      </div>
      <span class="label" data-i18n="updates.howToUpdate"></span>
      <ol class="update-steps" data-platform="mac">
        <li data-i18n-html="updates.clickDownloadBelowBudgetDmg"></li>
        <li data-i18n="updates.quitBudgetBudgetMenuQuit"></li>
        <li data-i18n-html="updates.openBudgetDmgAndDrag"></li>
        <li data-i18n-html="updates.openBudgetIfMacosSays"></li>
      </ol>
      <ol class="update-steps" data-platform="windows" hidden>
        <li data-i18n-html="updates.clickDownloadBelowBudgetSetup"></li>
        <li data-i18n="updates.openBudgetSetupExeIt"></li>
        <li data-i18n-html="updates.ifWindowsSaysItProtected"></li>
      </ol>
      <p class="muted update-safe" data-i18n="updates.yourBudgetsTransactionsAndSettings"></p>
      <div class="dialog-foot">
        <button type="button" id="update-skip" class="link-btn" data-i18n="updates.skipThisVersion"></button>
        <span class="spacer"></span>
        <button value="later" class="ghost-btn" data-i18n="updates.later"></button>
        <a id="update-download" class="primary-btn" target="_blank" rel="noopener" data-i18n="updates.download"></a>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="small">
    <form method="dialog">
      <h2></h2>
      <p class="muted"></p>
      <div class="dialog-foot">
        <button value="cancel" class="ghost-btn" data-i18n="common.cancel"></button>
        <button value="ok" class="primary-btn" data-i18n="common.ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="restore-dialog" class="small">
    <div class="dialog-head">
      <h2 data-i18n="common.restoreFromBackup"></h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
    </div>
    <div class="careful-step">
      <div><b data-i18n="backup.aBackupYouCreated"></b><span class="muted" data-i18n="backup.aBudgetFileForExample"></span></div>
      <button type="button" id="restore-file" class="ghost-btn" data-i18n="backup.chooseFile"></button>
    </div>
    <span class="label restore-label" data-i18n="backup.automaticBackups"></span>
    <p class="muted restore-hint" data-i18n="backup.budgetKeepsACopyOf"></p>
    <ul id="auto-backups" class="auto-backups"></ul>
    <div class="dialog-foot">
      <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
    </div>
  </dialog>

  <!-- Before replacing or deleting all data: create a backup first, or say no copy is needed. -->
  <dialog id="careful-dialog" class="small">
    <div class="dialog-head">
      <h2 id="careful-title"></h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
    </div>
    <p id="careful-text" class="careful-text"></p>
    <div class="careful-step">
      <div><b data-i18n="backup.firstCreateABackup"></b><span class="muted" data-i18n="backup.ofYourDataAsIt"></span></div>
      <a id="careful-backup" class="ghost-btn" href="/api/export" download data-i18n="common.createBackup"></a>
    </div>
    <p id="careful-done" class="careful-done" hidden data-i18n="backup.backupCreatedCheckThatThe"></p>
    <label class="careful-skip"><input type="checkbox" id="careful-skip"> <span id="careful-skip-text"></span></label>
    <div class="dialog-foot">
      <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
      <button type="button" class="danger-btn" id="careful-confirm" disabled></button>
    </div>
  </dialog>

  <dialog id="bank-dialog" class="xwide">
    <div class="dialog-head">
      <h2 id="bank-title" data-i18n="import.reviewTransactions"></h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close">×</button>
    </div>
    <p id="bank-hint" class="muted bank-hint"></p>
    <ul id="bank-list" class="bank-list"></ul>
    <p id="bank-error" class="error"></p>
    <div class="dialog-foot">
      <button type="button" class="ghost-btn" data-close data-i18n="common.cancel"></button>
      <button type="button" class="primary-btn" id="bank-add" data-i18n="common.add"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" popover="manual" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
